<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nevoeiro | Editora Névoa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #d1d5db; font-family: 'Inter', sans-serif; }
        .font-mystic { font-family: 'Special+Elite', cursive; }
        .tab-content { display: none; }
        .active { display: block; }
        .book-card:hover img { transform: scale(1.05); }
    </style>
</head>
<body class="selection:bg-red-900 selection:text-white">

    <nav class="border-b border-white/5 bg-black/80 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-tighter text-red-600 uppercase italic">Nevoeiro</h1>
            <div class="flex gap-6 text-[10px] font-bold uppercase tracking-[0.2em]">
                <button onclick="showTab('livros')" class="hover:text-red-500 transition">Biblioteca</button>
                <button onclick="showTab('resgate')" class="text-red-500 underline underline-offset-4">Resgatar</button>
                <button onclick="showTab('login')" class="border border-white/20 px-3 py-1 hover:bg-white hover:text-black transition">Conta</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-12">
        
        <section id="livros" class="tab-content active">
            <h2 class="text-3xl font-black uppercase mb-8 border-l-4 border-red-700 pl-4">Arquivo de Casos</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                
                <div class="book-card bg-[#0f0f12] border border-white/5 overflow-hidden transition-all">
                    <div class="h-96 overflow-hidden relative">
                        <img src="https://api-cluster.nevermissapps.com/public-blob/img_1777166166624_20260424_225838.png" 
                             class="w-full h-full object-cover transition-transform duration-700">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#0f0f12] via-transparent to-transparent"></div>
                    </div>
                    <div class="p-6">
                        <h3 class="text-xl font-bold uppercase">O Culpado</h3>
                        <p class="text-xs text-gray-500 my-2 italic">Quem matou Jack Ferreira?</p>
                        <button class="w-full bg-red-700 text-black font-black py-2 hover:bg-red-600 transition uppercase text-xs">Baixar Arquivo</button>
                    </div>
                </div>

                <div class="opacity-40 grayscale pointer-events-none bg-[#0f0f12] border border-white/5 overflow-hidden">
                    <div class="h-96 bg-neutral-900 flex items-center justify-center relative">
                        <span class="font-mystic text-2xl uppercase opacity-20">BLOQUEADO</span>
                    </div>
                    <div class="p-6">
                        <h3 class="text-xl font-bold uppercase">The House</h3>
                        <p class="text-xs text-gray-500 my-2 italic">Acesso restrito via Key.</p>
                        <button class="w-full bg-neutral-800 py-2 text-xs font-bold">RESTRITO</button>
                    </div>
                </div>

            </div>
        </section>

        <section id="resgate" class="tab-content">
            <div class="max-w-md mx-auto py-20 text-center">
                <h2 class="text-2xl font-black mb-6 italic uppercase tracking-widest text-red-600">Inserir Credenciais</h2>
                <input type="text" id="keyInput" placeholder="NEVOA-LIVRO-XXXX" 
                    class="w-full bg-black border border-white/10 p-4 font-mono text-red-500 text-center mb-4 focus:border-red-600 outline-none">
                <button onclick="validarKey()" class="w-full bg-red-700 py-4 font-black uppercase text-black hover:bg-red-600">Desbloquear</button>
                <div id="statusMsg" class="mt-6 text-sm font-bold uppercase"></div>
            </div>
        </section>

    </main>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        async function validarKey() {
            const key = document.getElementById('keyInput').value;
            const status = document.getElementById('statusMsg');
            if(!key) return;

            status.innerText = "Verificando...";
            const response = await fetch('/resgatar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ key: key })
            });
            const result = await response.json();
            
            if(result.success) {
                status.innerHTML = `<span class="text-green-500">Acesso Concedido: ${result.livro}</span>`;
            } else {
                status.innerHTML = `<span class="text-red-600">${result.message}</span>`;
            }
        }
    </script>
</body>
</html>
